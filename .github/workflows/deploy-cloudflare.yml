name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/ci-tests.yml

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13

      - name: Restore Astro cache
        uses: actions/cache@v4
        with:
          path: |
            .astro
            node_modules/.vite
          key: ${{ runner.os }}-astro-${{ hashFiles('bun.lockb') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx', '**/*.astro') }}
          restore-keys: |
            ${{ runner.os }}-astro-${{ hashFiles('bun.lockb') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Astro
        env:
          SITE_URL: ${{ github.ref_name == 'main'
            && (secrets.CLOUDFLARE_SITE_URL || format('https://{0}.pages.dev', secrets.CLOUDFLARE_PAGES_PROJECT))
            || github.ref_name == 'develop'
            && (secrets.CLOUDFLARE_SITE_URL_DEVELOP || format('https://develop.{0}.pages.dev', secrets.CLOUDFLARE_PAGES_PROJECT))
            || format('https://{0}.{1}.pages.dev', github.ref_name, secrets.CLOUDFLARE_PAGES_PROJECT) }}
          NEXT_PUBLIC_BASE_PATH: ${{ secrets.CLOUDFLARE_BASE_PATH || '' }}
          PUBLIC_BASE_PATH: ${{ secrets.CLOUDFLARE_BASE_PATH || '' }}
          NEXT_PUBLIC_ASSET_VERSION: ${{ github.sha }}
          PUBLIC_ASSET_VERSION: ${{ github.sha }}
          NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${{ secrets.GOOGLE_ANALYTICS_ID }}
          PUBLIC_GOOGLE_ANALYTICS_ID: ${{ secrets.GOOGLE_ANALYTICS_ID }}
          INCLUDE_DRAFTS: 'false'
        run: bun run build

      - name: Build Storybook
        env:
          HOME: .storybook-home
          STORYBOOK_DISABLE_TELEMETRY: '1'
          STORYBOOK_DISABLE_GLOBAL_SETTINGS: 'true'
          STORYBOOK_DISABLE_VERSION_CHECK: 'true'
        run: |
          bun run storybook:build
          mkdir -p out/storybook
          cp -R storybook-static/* out/storybook

      - name: Publish to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy ./out
            --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ github.ref_name }}
            --commit-hash=${{ github.sha }}

      # The scanner follows redirects, so a deployment behind Cloudflare Access or not yet serving the Functions
      # bundle shows up only as "level 0". Require this build's own Link header on / first, without following
      # redirects, so such a failure names its cause.
      # Preview deployments sit behind Cloudflare Access (302 to a login page), so scanners can only see the
      # production domain. Score main deploys there; develop deploys skip the scan.
      - name: Wait for deployment to serve agent headers
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOYMENT_URL: https://iamtatsuki05.com
        run: |
          for attempt in $(seq 1 20); do
            headers=$(curl -sS --max-time 10 -o /dev/null -D - "$DEPLOYMENT_URL/" || true)
            if grep -qiE '^HTTP/[0-9.]+ 200' <<<"$headers" && grep -qiE '^link:.*rel="alternate"; type="text/markdown"' <<<"$headers"; then
              echo "deployment serves agent headers after $attempt attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Deployment did not return 200 with the Markdown Link header on / within 60s. Last response headers:"
          grep -iE '^(HTTP/|location|link|content-type|cf-|x-robots-tag|www-authenticate)' <<<"$headers" || true
          exit 1

      # isitagentready.com (Cloudflare). Level 3 = robots/sitemap/Link headers + AI bot rules and Content Signals
      # + Markdown negotiation. Level 4+ needs an API catalog, MCP/A2A card, or Agent Skills, which a content site lacks.
      - name: Gate on isitagentready.com level
        id: readiness
        if: github.ref == 'refs/heads/main'
        uses: lingzhong/agent-readiness-action@98bc36041104db6e40c2ef51f9c4022ed9a94502 # v0.1.1
        with:
          url: https://iamtatsuki05.com
          min-level: '3'

      - name: Report failing isitagentready.com checks
        if: github.ref == 'refs/heads/main' && failure() && steps.readiness.outputs.response != ''
        env:
          RESPONSE: ${{ steps.readiness.outputs.response }}
        run: |
          jq -r '"### isitagentready.com: level \(.level) (\(.levelName))\n" + ([.checks[] | to_entries[] | select(.value.status == "fail" and (.key | IN("robotsTxt", "sitemap", "linkHeaders", "robotsTxtAiRules", "contentSignals", "markdownNegotiation"))) | "- \(.key): \(.value.message)" + ([.value.evidence[]? | select(.request.url) | "\n  - \(.label) \(.request.url | sub("^https?://[^/]+"; "")) -> \(.response.status // "no response")"] | join(""))] | join("\n"))' <<<"$RESPONSE" >> "$GITHUB_STEP_SUMMARY" || printf '%s\n' "$RESPONSE" >> "$GITHUB_STEP_SUMMARY"

      # is-agentic.com (Vercel) has no threshold yet: report the score only.
      - name: Report is-agentic.com score
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          DEPLOYMENT_URL: https://iamtatsuki05.com
        run: |
          npx -y is-agentic@1.0.1 "$DEPLOYMENT_URL" --json > is-agentic.json
          jq -r '"### is-agentic.com: \(.score) / 100 (\(.score_label))\n\(.report_url)\n\n" + ([(.issues // [])[] | "- \(.result) [\(.tier)] \(.name)"] | join("\n"))' is-agentic.json >> "$GITHUB_STEP_SUMMARY"
