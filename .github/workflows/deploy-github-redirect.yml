name: Deploy GitHub Pages redirect

# iamtatsuki05.github.io only forwards visitors to iamtatsuki05.com; the site itself is on Cloudflare Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun scripts/build-github-redirect.ts github-redirect
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./github-redirect
      - id: deployment
        uses: actions/deploy-pages@v5
